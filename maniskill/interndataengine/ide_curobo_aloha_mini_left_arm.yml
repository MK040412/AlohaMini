      [
        "left_Base",
        "left_Rotation_Pitch",
        "left_Upper_Arm",
        "left_Lower_Arm",
        "left_Wrist_Pitch_Roll",
        "left_Fixed_Jaw",
        "left_finger1",
        "left_finger2"
      ]
    external_asset_path: null # Use this to add path for externally located assets/robot folder.
    lock_joints: {"left_finger_joint1": 0.037, "left_finger_joint2": 0.037}

    cspace:
      joint_names: ["left_shoulder_pan","left_shoulder_lift","left_elbow_flex","left_wrist_flex","left_wrist_roll"]
      retract_config: [0.0, 0.3, -0.3, 0.0, 0.0]
      null_space_weight: [1,1,1,1,1]
      cspace_distance_weight: [1,1,1,1,1]
      max_acceleration: 15.0
      max_jerk: 500.0
