        - "center": [0.0, 0.0, 0.018]
          "radius": 0.036
        - "center": [0.0, 0.034, 0.018]
          "radius": 0.034
      left_Rotation_Pitch:
        - "center": [0.0, 0.018, 0.022]
          "radius": 0.034
        - "center": [0.0, 0.06, 0.03]
          "radius": 0.035
        - "center": [0.0, 0.102, 0.031]
          "radius": 0.033
      left_Upper_Arm:
        - "center": [0.0, 0.02, 0.004]
          "radius": 0.033
        - "center": [0.0, 0.055, 0.011]
          "radius": 0.033
        - "center": [0.0, 0.09, 0.021]
          "radius": 0.032
        - "center": [0.0, 0.113, 0.028]
