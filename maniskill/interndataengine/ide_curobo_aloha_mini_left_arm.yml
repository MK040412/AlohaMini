        "left_Base",
        "left_Rotation_Pitch",
        "left_Upper_Arm",
        "left_Lower_Arm",
        "left_Wrist_Pitch_Roll",
        "left_Fixed_Jaw",
        "left_finger1",
        "left_finger2",
        "attached_object",
      ]
