    extra_collision_spheres: {"attached_object": 4}
    self_collision_ignore:
      {
        "left_Base": ["left_Rotation_Pitch", "left_Upper_Arm", "left_Lower_Arm", "left_Wrist_Pitch_Roll", "left_Fixed_Jaw", "left_finger1", "left_finger2", "attached_object"],
        "left_Rotation_Pitch": ["left_Upper_Arm", "left_Lower_Arm", "left_Wrist_Pitch_Roll", "left_Fixed_Jaw", "left_finger1", "left_finger2", "attached_object"],
        "left_Upper_Arm": ["left_Lower_Arm", "left_Wrist_Pitch_Roll", "left_Fixed_Jaw", "left_finger1", "left_finger2", "attached_object"],
        "left_Lower_Arm": ["left_Wrist_Pitch_Roll", "left_Fixed_Jaw", "left_finger1", "left_finger2", "attached_object"],
        "left_Wrist_Pitch_Roll": ["left_Fixed_Jaw", "left_finger1", "left_finger2", "attached_object"],
        "left_Fixed_Jaw": ["left_finger1", "left_finger2", "attached_object"],
        "left_finger1": ["left_finger2", "attached_object"]
      }
