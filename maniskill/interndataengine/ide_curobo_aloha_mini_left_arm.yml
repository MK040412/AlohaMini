      {
        "left_Base": 0.04,
        "left_Rotation_Pitch": 0.035,
        "left_Upper_Arm": 0.035,
        "left_Lower_Arm": 0.035,
        "left_Wrist_Pitch_Roll": 0.025,
        "left_Fixed_Jaw": 0.02,
        "left_finger1": 0.01,
        "left_finger2": 0.01,
        "attached_object": 0.0,
      }
