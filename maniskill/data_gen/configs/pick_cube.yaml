num_episodes: 1
seed: 0

load:
  name: mani_skill_env_loader
  env_id: AlohaMiniTablePick-v1
  obs_mode: rgb
  control_mode: pd_joint_pos_fixed_base
  render_mode: sensors
  num_envs: 1
  sim_backend: auto
  render_backend: gpu
  env_kwargs:
    cube_xy_noise: 0.0
    max_episode_steps: 360
  domain_randomizer:
    name: aloha_mini_domain_randomizer
    enabled: false
    cube_xy_noise: 0.01

planner:
  name: skill_sequence
  task: Pick the cube from the pedestal with the AlohaMini left gripper.
  arm_dof: 5
  max_steps: 300
  objects:
    - name: cube
      actor: cube
      target_class: RigidObject
      color: red
  regions:
    - object: cube
      target: platform
      random_type: fixed_on_pedestal
  skills:
    - name: pick
      arm: left
      object_actor: cube
      approach_height: 0.10
      descend_offset: -0.01
      lift_start: 0.0
      lift_height: 0.16
      approach_steps: 30
      descend_steps: 35
      close_steps: 45
      lift_steps: 120
      hold_steps: 40

render:
  name: mani_skill_renderer
  fps: 30
  cameras:
    - cam_main
    - cam_left_wrist
    - cam_right_wrist
  camera_map:
    cam_main: head
    cam_left_wrist: hand_left
    cam_right_wrist: hand_right
  missing_camera: black

store:
  name: lerobot_v21
  output_dir: data_gen/output/aloha_mini_pick_cube
  dataset_name: aloha_mini_pick_cube
  robot_type: aloha_mini_so100_v2
  fps: 30
  overwrite: false
  chunk_size: 1000
  video_codec: libx264
