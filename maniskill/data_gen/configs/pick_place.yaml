num_episodes: 1
seed: 0

load:
  name: mani_skill_env_loader
  env_id: AlohaMiniPickPlace-v1
  obs_mode: rgb
  control_mode: pd_joint_pos_fixed_base
  render_mode: sensors
  num_envs: 1
  sim_backend: auto
  render_backend: gpu
  env_kwargs:
    cube_xy_noise: 0.0
  domain_randomizer:
    name: aloha_mini_domain_randomizer
    enabled: false

planner:
  name: skill_sequence
  task: Pick the red cube and place it on the green goal platform.
  arm_dof: 5
  max_steps: 460
  objects:
    - name: cube
      actor: cube
      target_class: RigidObject
      color: red
    - name: goal_platform
      actor: goal_marker
      target_class: GeometryObject
      color: green
  regions:
    - object: cube
      target: platform
      random_type: fixed_on_pedestal
    - object: goal_platform
      target: table
      random_type: fixed_goal
      position: [-0.13, -0.35, 0.70]
  skills:
    - name: pick
      arm: left
      object_actor: cube
      approach_height: 0.10
      descend_offset: -0.01
      lift_start: 0.0
      lift_height: 0.16
    - name: place
      arm: left
      target_xyz: [-0.13, -0.35, 0.72]
      lift_height: 0.16
      pre_place_height: 0.10
      place_height_offset: 0.0
      retreat_height: 0.10

render:
  name: mani_skill_renderer
  fps: 30
  cameras:
    - cam_main
    - cam_left_wrist
    - cam_right_wrist
  camera_map:
    cam_main: head
    cam_left_wrist: hand_left
    cam_right_wrist: hand_right
  missing_camera: black

store:
  name: lerobot_v21
  output_dir: data_gen/output/aloha_mini_pick_place
  dataset_name: aloha_mini_pick_place
  robot_type: aloha_mini_so100_v2
  fps: 30
  overwrite: false
  chunk_size: 1000
  video_codec: libx264
